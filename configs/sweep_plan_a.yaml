# Sweep configuration for Plan A: paper verification
# 3 configs x 100 seeds = 300 runs (now all at 300 epochs)

# Global settings
workers: 10
use_amp: true
cudnn_benchmark: true

# Configurations to sweep
configs:
  - name: baseline_wgan
    path: configs/baseline_wgan.yaml
    epochs: 300
    seeds: 100

  - name: fegan_hist_wgan
    path: configs/fegan_hist_wgan.yaml
    epochs: 300  # Increased from 100: empirical testing shows 200+ needed
    seeds: 100

  - name: fegan_hist_tailgan
    path: configs/fegan_hist_tailgan.yaml
    epochs: 300  # Increased from 100: empirical testing shows 200+ needed
    seeds: 100
