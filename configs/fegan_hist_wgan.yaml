# FE-GAN with historical context and WGAN loss
# Note: Paper claims 100 epochs, but empirical testing shows 200+ needed to converge
model_type: fegan
loss_type: wgan

# Architecture (from Chen 2024)
noise_dim: 100
gen_depth: 10
gen_width: 1000
critic_depth: 5
critic_width: 100
hist_dim: 250
preproc_hidden: 512
preproc_feat_dim: 250

# Training
epochs: 300
batch_size: 100
n_critic: 5
clip_value: 0.01
lr: 5.0e-5

# Evaluation
alpha: 0.05
eval_every: 10
eval_samples: 1000
